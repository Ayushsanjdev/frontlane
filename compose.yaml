services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: frontlanejobs
      POSTGRES_USER: frontlanejobs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - frontlanejobs-db:/var/lib/postgresql/data
      - ./packages/database/schema/001-init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U frontlanejobs -d frontlanejobs']
      interval: 5s
      timeout: 5s
      retries: 12
  app:
    build: .
    ports: ["3000:3000"]
    env_file: .env.local
    environment:
      DATABASE_URL: postgresql://frontlanejobs:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/frontlanejobs
      DB_SSL: 'false'
    depends_on:
      db:
        condition: service_healthy
volumes:
  frontlanejobs-db:
