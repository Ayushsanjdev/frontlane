name: Refresh Frontlane employer feeds
on:
  schedule:
    # UTC: 08:00 and 18:00 in India. GitHub may delay scheduled runs.
    - cron: '30 2,12 * * *'
  workflow_dispatch:
concurrency:
  group: frontlane-public-job-ingestion
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm jobs:refresh
        env:
          APP_URL: ${{ vars.APP_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
